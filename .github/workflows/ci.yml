name: CI

on:
  pull_request:
    branches: [main]      # verifica ANTES del merge (lo que hace el trabajo)
  push:
    branches: [main]      # da estado al badge y deja el cache para todos

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del backend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/joaquinlista/insgsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/joaquinlista/insgsoft3-tp01-frontend:sha-${{ github.sha }}
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]   # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'      # los PRs verifican; solo main despliega
    environment: qa
    steps:
      # Los servicios de Render son de imagen, no de repo git: el hook necesita
      # `imgURL` (la ruta ya pusheada por build-backend/build-frontend), no `ref`
      # — `ref` es para servicios que buildean el Dockerfile ellos mismos.
      - name: Disparar deploy en Render (backend + front) — la imagen de este commit
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&imgURL=ghcr.io%2Fjoaquinlista%2Finsgsoft3-tp01-backend%3Asha-$GITHUB_SHA"
          curl -fsS --max-time 30 "$HOOK_FRONT&imgURL=ghcr.io%2Fjoaquinlista%2Finsgsoft3-tp01-frontend%3Asha-$GITHUB_SHA"

      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://panaderias-api-qa.onrender.com
          URL_FRONT: https://panaderias-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/health" \
               && curl -fsS --max-time 10 "$URL_API/api/sucursales" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa                          # QA ya tiene el deploy de este commit corriendo
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar (sin navegador)
        run: npm ci                            # estas pruebas no abren browser: no hace falta Playwright install
        working-directory: ./frontend

      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://panaderias-api-qa.onrender.com
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-integracion   # distinto del de e2e: dos iguales rompen la corrida
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion                        # si la api está rota, no gastamos un browser en confirmarlo
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar + navegador
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra el front de QA
        env:
          E2E_BASE_URL: https://panaderias-front-qa.onrender.com
          API_BASE_URL: https://panaderias-api-qa.onrender.com
        run: npx playwright test e2e/pedidos.spec.js   # su archivo: sin esto vuelve a correr la integración
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}                 # el reporte importa MÁS cuando falla
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                                # el gate: sin e2e verde, ni se pide aprobación
    environment: production                   # acá el workflow SE PAUSA hasta el approve
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Disparar deploy en Render (backend + front) — la misma imagen aprobada
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          curl -fsS --max-time 30 "$HOOK_API&imgURL=ghcr.io%2Fjoaquinlista%2Finsgsoft3-tp01-backend%3Asha-$GITHUB_SHA"
          curl -fsS --max-time 30 "$HOOK_FRONT&imgURL=ghcr.io%2Fjoaquinlista%2Finsgsoft3-tp01-frontend%3Asha-$GITHUB_SHA"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: https://panaderias-api-prod.onrender.com
          URL_FRONT: https://panaderias-front-prod.onrender.com
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/api/health" \
               && curl -fsS --max-time 10 "$URL_API/api/sucursales" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ PROD responde (API + BD + front)"; exit 0
            fi
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
